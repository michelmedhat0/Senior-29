<style>
:root{--blue:#1b4a9e;--blue-d:#12326d;--gold:#c9a24a;--cream:#f7f0de;--paper:#fffdf7;--red:#b3262f;--ink:#1d2433;--mute:#6b7280;--line:#e4dac0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Nunito Sans','Cairo',system-ui,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0;color:var(--blue-d)}
button,input,select,textarea{font:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #1b4a9e55;border-color:var(--blue)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.auth{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.auth-card{width:100%;max-width:400px;background:var(--paper);border:1.5px solid var(--gold);border-radius:14px;padding:26px 24px;text-align:center;box-shadow:0 10px 30px #12326d1f}
.auth-card img{width:150px;height:150px;object-fit:contain;mix-blend-mode:multiply}
.auth-card h1{font-size:30px;margin-top:4px}
.auth-card p.sub{color:var(--mute);margin:2px 0 14px;font-size:14px}
.auth-card form{text-align:left}
.switch{display:flex;gap:6px;margin:12px 0 4px}
.switch button{flex:1}
.classes{display:flex;gap:10px}
.classes label{flex:1;margin:0;border:1.5px solid var(--line);border-radius:8px;padding:10px;text-align:center;cursor:pointer;background:#fff}
.classes input{display:none}
.classes label:has(input:checked){border-color:var(--blue);background:#1b4a9e14;color:var(--blue-d);font-weight:700}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:10px}
.note{font-size:12.5px;color:var(--mute);margin-top:4px}
header.top{background:var(--blue-d);border-bottom:4px solid var(--gold);color:#fff}
.top-in{max-width:780px;margin:auto;display:flex;align-items:center;gap:12px;padding:8px 14px}
.top-in img{width:50px;height:50px;border-radius:50%;background:#fff;padding:2px;object-fit:contain}
.top-in .who{flex:1;min-width:0}
.top-in b{display:block;font-family:'Cormorant Garamond',serif;font-size:21px;line-height:1.1}
.top-in span{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.top-in .btn{background:#ffffff1f}
nav.tabs{background:var(--paper);border-bottom:1.5px solid var(--line);position:sticky;top:0;z-index:5}
.tabs-in{max-width:780px;margin:auto;display:flex}
.tabs-in button{flex:1;background:none;border:0;padding:13px 6px;font-weight:700;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent}
.tabs-in button[aria-selected=true]{color:var(--blue);border-bottom-color:var(--red)}
main{max-width:780px;margin:auto;padding:18px 14px 60px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.card h3{font-size:23px}
.card .meta{font-size:13px;color:var(--mute);margin:2px 0 8px}
.card p{margin:0;white-space:pre-wrap}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:#1b4a9e18;color:var(--blue-d)}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chat{display:flex;flex-direction:column;height:calc(100vh - 250px);min-height:340px}
.msgs{flex:1;overflow-y:auto;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;background:#fff;border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:7px 11px}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-color:var(--blue);border-radius:12px 12px 3px 12px}
.msg .n{font-size:12px;font-weight:700;opacity:.8}
.msg .t{font-size:11px;opacity:.65;margin-left:6px;font-weight:400}
.msg .x{background:none;border:0;color:inherit;opacity:.6;cursor:pointer;font-size:12px;padding:0 0 0 8px}
.msg div.b{white-space:pre-wrap;overflow-wrap:anywhere}
.send{display:flex;gap:8px;margin-top:10px}
.rooms{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.rooms .btn[aria-pressed=true]{background:var(--blue);color:#fff}
.day{margin-bottom:14px}
.day h3{border-bottom:2px solid var(--gold);padding-bottom:2px;margin-bottom:6px}
.slot{display:flex;gap:12px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-left:5px solid var(--blue);border-radius:8px;padding:8px 12px;margin-bottom:6px}
.slot time{font-weight:700;color:var(--blue-d);min-width:98px;font-size:14px}
.slot .s{flex:1}
.slot .s small{color:var(--mute);display:block}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:20;font-size:14px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}.chat{height:calc(100vh - 270px)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.lang{display:flex;align-items:center;gap:4px;color:#fff;font-size:15px;margin:0;font-weight:400}
.lang select{width:auto;padding:4px 6px;font-size:13px}
.auth-card .lang{color:var(--blue-d);justify-content:center;margin-bottom:6px}
.foot{text-align:center;font-size:12.5px;color:var(--mute);padding:14px 16px 20px;border-top:1.5px solid var(--line);background:var(--paper)}
.bar{position:relative;background:#1b4a9e14;border-radius:8px;overflow:hidden;margin-top:8px}
.bar i{position:absolute;top:0;bottom:0;inset-inline-start:0;background:#1b4a9e33}
.bar>span{position:relative;display:flex;justify-content:space-between;padding:8px 10px;font-weight:600}
.opt{width:100%;margin-top:8px;text-align:start}
[dir=rtl] .auth-card form,[dir=rtl] ol{text-align:right}
.urow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:9px 0}
.urow .i{flex:1;min-width:150px}
.tabs-in button{white-space:nowrap}
[data-theme=dark]{--cream:#10182b;--paper:#182238;--ink:#e8ecf5;--mute:#9aa6bf;--line:#2c3a58;--blue:#6ea0ff;--blue-d:#a9c4ff}
[data-theme=dark] input,[data-theme=dark] select,[data-theme=dark] textarea,[data-theme=dark] .classes label,[data-theme=dark] .msg{background:#0f1729;color:var(--ink)}
[data-theme=dark] .msg.me{background:#2b5fc7;color:#fff}
[data-theme=dark] header.top{background:#0b1020}
[data-theme=dark] .btn{background:#2b5fc7;color:#fff}
[data-theme=dark] .btn.ghost{background:transparent;color:var(--blue);border-color:var(--blue)}
[data-theme=dark] .btn.danger{background:transparent;color:#ff7b84;border-color:#ff7b84}
[data-theme=dark] .auth-card img{mix-blend-mode:normal;background:#fff;border-radius:12px;padding:4px}
[data-theme=dark] .auth-card .lang{color:var(--blue-d)}
.rx{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.rx button[aria-pressed=true]{background:#1b4a9e2e}
</style>
</head>

create function handle_new_user() returns trigger language plpgsql security definer set search_path=public as $$
begin insert into profiles(id,name,phone,classe) values(new.id,coalesce(new.raw_user_meta_data->>'name','Eleve'),coalesce(new.raw_user_meta_data->>'phone',''),case when new.raw_user_meta_data->>'classe'='B' then 'B' else 'A' end); return new; end $$;
create trigger on_auth_user_created after insert on auth.users for each row execute function handle_new_user();

create function is_admin() returns boolean language sql security definer set search_path=public stable as $$ select exists(select 1 from profiles where id=auth.uid() and role in('admin','owner') and not blocked) $$;
create function is_owner() returns boolean language sql security definer set search_path=public stable as $$ select exists(select 1 from profiles where id=auth.uid() and role='owner') $$;
create function is_blocked() returns boolean language sql security definer set search_path=public stable as $$ select coalesce((select blocked from profiles where id=auth.uid()),true) $$;

-- filtre de gros mots: le message est supprime et l'auteur bloque automatiquement (sauf admins)
create function norm(t text) returns text language sql immutable as $$
 select regexp_replace(regexp_replace(translate(lower(t),'أإآىةـ','ااايه'),'[\\u064B-\\u065F]','','g'),'(.)\\1+','\\1','g') $$;
create function squash(t text) returns text language sql immutable as $$
 select regexp_replace(norm(t),'[[:space:][:punct:]،؟؛]','','g') $$;
create function filter_message() returns trigger language plpgsql security definer set search_path=public as $$
begin
 if exists(select 1 from banned_words w where length(squash(w.word))>1 and (position(norm(w.word) in norm(new.body))>0 or position(squash(w.word) in squash(new.body))>0))
    and not exists(select 1 from profiles where id=new.user_id and role in('admin','owner')) then
  update profiles set blocked=true where id=new.user_id; return null;
 end if; return new;
end $$;
create trigger msg_filter before insert on messages for each row execute function filter_message();

create function set_blocked(uid uuid,b boolean) returns void language plpgsql security definer set search_path=public as $$
begin if not is_admin() then raise exception 'not allowed'; end if;
 update profiles set blocked=b where id=uid and role<>'owner' and (role='student' or is_owner()); end $$;
create function set_role(uid uuid,r text) returns void language plpgsql security definer set search_path=public as $$
begin if not is_owner() then raise exception 'not allowed'; end if;
 if r not in('student','admin') then raise exception 'bad role'; end if;
 update profiles set role=r where id=uid and role<>'owner'; end $$;
create function delete_user(uid uuid) returns void language plpgsql security definer set search_path=public as $$
begin if not is_owner() then raise exception 'not allowed'; end if;
 delete from auth.users where id=uid and exists(select 1 from profiles p where p.id=uid and p.role<>'owner'); end $$;
